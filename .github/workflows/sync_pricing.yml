name: Sync Google Cloud & Multi-Provider Model Pricing

on:
  schedule:
    # Runs every Monday at 06:00 UTC to keep default_rates.json up to date
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      include_new_models:
        description: "Also discover and add new flagship models (e.g. gpt-4.1, o3, claude-4)"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  id-token: write  # Enables PyPI Trusted Publishing (OIDC)

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build & package dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[rich]"

      - name: Run Google Cloud & Multi-Provider Pricing Extraction Framework
        env:
          GOOGLE_CLOUD_BILLING_API_KEY: ${{ secrets.GOOGLE_CLOUD_BILLING_API_KEY }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.include_new_models || 'true' }}" = "true" ]; then
            EXTRA_FLAGS="--include-new-models"
          fi
          python -m adk_finops.pricing_extractor --update-default $EXTRA_FLAGS

      - name: Check for pricing changes & bump patch version
        id: check_changes
        run: |
          if git diff --quiet src/adk_finops/rates/default_rates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pricing changes detected in default_rates.json. Skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            NEW_VERSION=$(python -c '
          import pathlib, re
          pyproject = pathlib.Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          m = re.search(r"^version\s*=\s*\"(\d+)\.(\d+)\.(\d+)\"", text, re.M)
          major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3)) + 1
          new_ver = f"{major}.{minor}.{patch}"
          pyproject.write_text(re.sub(r"^version\s*=\s*\"[^\"]+\"", f"version = \"{new_ver}\"", text, count=1, flags=re.M), encoding="utf-8")
          ver_file = pathlib.Path("src/adk_finops/_version.py")
          vtext = ver_file.read_text(encoding="utf-8")
          ver_file.write_text(re.sub(r"__version__\s*=\s*\"[^\"]+\"", f"__version__ = \"{new_ver}\"", vtext), encoding="utf-8")
          print(new_ver)
          ')
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "Bumped adk-finops version to $NEW_VERSION"
          fi

      - name: Commit, tag, and push updated rate card & version
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adk_finops/rates/default_rates.json pyproject.toml src/adk_finops/_version.py
          git commit -m "chore(release): v${{ steps.check_changes.outputs.new_version }} — auto-sync LLM pricing rate card"
          git tag "v${{ steps.check_changes.outputs.new_version }}"
          git push origin HEAD --tags

      - name: Build sdist and wheel package
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          rm -rf dist/
          python -m build

      - name: Publish package to PyPI
        if: steps.check_changes.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub Release
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.check_changes.outputs.new_version }}"
          gh release create "$TAG" dist/* \
            --title "$TAG — Automated LLM Pricing Rate Card Sync" \
            --notes "Automated synchronization of Google Cloud Gemini Enterprise & multi-provider pricing in \`default_rates.json\`." \
            --generate-notes \
            --latest

