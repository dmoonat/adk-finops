name: Sync Google Cloud & Multi-Provider Model Pricing

on:
  schedule:
    # Runs every Monday at 06:00 UTC to keep default_rates.json up to date
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      include_new_models:
        description: "Also discover and add new flagship models (e.g. gpt-4.1, o3, claude-4)"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  id-token: write  # Passed through to release.yml for PyPI Trusted Publishing

concurrency:
  group: pypi-release-main
  cancel-in-progress: false

jobs:
  sync-rate-card:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check_changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rich]"

      - name: Run Google Cloud & Multi-Provider Pricing Extraction Framework
        env:
          GOOGLE_CLOUD_BILLING_API_KEY: ${{ secrets.GOOGLE_CLOUD_BILLING_API_KEY }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.include_new_models || 'true' }}" = "true" ]; then
            EXTRA_FLAGS="--include-new-models"
          fi
          python -m adk_finops.pricing_extractor --update-default $EXTRA_FLAGS

      - name: Commit and push updated default_rates.json if changed
        id: check_changes
        run: |
          if git diff --quiet src/adk_finops/rates/default_rates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pricing changes detected in default_rates.json. Skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/adk_finops/rates/default_rates.json
            git commit -m "chore(rates): auto-sync Google Cloud & multi-provider pricing [skip ci]"
            git push origin HEAD:main
          fi

  trigger-release:
    needs: sync-rate-card
    if: needs.sync-rate-card.outputs.changed == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit


